[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-mail-mcp"
version = "0.1.0"
description = "Korean Mail MCP Server (Naver, Daum, Kakao) for Claude Desktop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "chanmuzi"},
]
keywords = ["mcp", "naver", "daum", "kakao", "korean", "email", "imap", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=2",
]

[project.scripts]
korean-mail-mcp = "korean_mail_mcp.server:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "C4", "PIE", "RET", "RUF", "PERF", "BLE", "A", "ISC", "PL", "T20"]
ignore = [
    "PLR0912",  # branch/argument/statement counts and magic values are style, not defects
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PERF203",  # charset fallback loops rely on try/except per candidate
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "T201"]
# script-style runner: loads .env before importing the package and reports every failure
"tests/test_integration.py" = ["S101", "T201", "E402", "PLC0415", "PLW2901", "BLE001", "F841"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests/test_unit.py"]
