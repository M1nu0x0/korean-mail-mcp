name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_PYTHON: "3.13"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock --check
      - run: uv sync --locked --python "$TOOL_PYTHON"
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .

  static:
    name: static (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      PYVER: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # mcp needs Python >= 3.10, so the tools run on TOOL_PYTHON and analyse the code as PYVER.
      - run: uv sync --locked --python "$TOOL_PYTHON"
      - name: ruff (target py${{ matrix.python }})
        # pyupgrade (UP) rewrites for the target version; the lint job runs it once for the minimum.
        run: uv run --no-sync ruff check --output-format=github --ignore UP --target-version "py${PYVER//./}" .
      - name: pyright (pythonVersion ${{ matrix.python }})
        run: uv run --no-sync pyright --pythonversion "$PYVER"
      - name: byte-compile on the real interpreter
        run: uv run --no-project --python "$PYVER" python -W error -m compileall -q src tests

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest -v

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: install the wheel into a clean environment
        run: uv run --isolated --no-project --python "$TOOL_PYTHON" --with dist/*.whl python -c "import korean_mail_mcp.server"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv export --locked --no-emit-project --no-dev -o requirements.txt
      - run: uvx pip-audit --disable-pip --require-hashes -r requirements.txt
